<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b100e">
<title>GolfHomie</title>
<!-- Fetched with the login cookie, because the site sits behind a login wall that would otherwise turn the request away. -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GolfHomie">
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script>
  // Apply the saved look before anything draws, so there's no flash of the wrong colours.
  try { var t = localStorage.getItem('theme'); if (t && t !== 'augusta') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="/app.js"></script>
<script src="/track.js"></script>
</body>
</html>
