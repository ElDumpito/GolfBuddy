# GolfBuddy's own Cloudflare tunnel connector, as a second small Container Station application named "golfbuddy-tunnel".
# Cloudflare side: tunnel "golfbuddy", public hostname golf.juno.nexus -> http://golfbuddy:8790,
# behind the Access application "GolfBuddy".
# Paste this into Container Station > Applications > Create with the tunnel's token in place of the placeholder
# (Cloudflare dashboard > Networking > Tunnels > golfbuddy > the long string after "--token" in the Docker command).
services:
  golfbuddy-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: golfbuddy-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=paste-your-tunnel-token-here
    restart: unless-stopped
